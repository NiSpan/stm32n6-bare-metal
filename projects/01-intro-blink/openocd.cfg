# OpenOCD config for NUCLEO-N657X0-Q. Plain "openocd" in this folder reads it.
# [find X] searches OpenOCD's script dir (/usr/local/share/openocd/scripts).

# Probe: ST-LINK in "DAP direct" mode (SWD, can reach any access port).
# The older interface/stlink.cfg (hla mode) only reaches AP0.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# Chip: STM32N6 (Cortex-M55)
source [find target/stm32n6x.cfg]
